service: cvcraft
image: nasserfq/cvcraft

servers:
  web:
    - 159.195.9.248
  worker:
    hosts:
      - 159.195.9.248
    cmd: bundle exec sidekiq -e production

proxy:
  ssl: true
  host: cvcrft.com

ssh:
  user: root
  keys:
    - "~/.ssh/cvcraft_netcup"

registry:
  username: nasserfq
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - CVCRAFT_DATABASE_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - ADMIN_PASSWORD
    - MOYASAR_SECRET_KEY
    - JEV_API_KEY
    # Social sign-in (packs/accounts). Optional: a provider's button is hidden while its vars are empty.
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - APPLE_CLIENT_ID
    - APPLE_TEAM_ID
    - APPLE_KEY_ID
    - APPLE_PRIVATE_KEY
    - LINKEDIN_CLIENT_ID
    - LINKEDIN_CLIENT_SECRET
  clear:
    REDIS_URL: redis://cvcraft-redis:6379/1
    DATABASE_HOST: cvcraft-db
    DATABASE_USER: cvcraft
    DATABASE_NAME: cvcraft_production
    VITE_PUBLIC_POSTHOG_KEY: phc_hbgIlm0QjZDuhGEO7YYg2tuAQcMnLDsafnm8A0Dw5S6
    VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    AWS_REGION: us-east-1
    AI_PROVIDER: bedrock
    # Amazon Nova Lite: the cheapest model AWS credits surely cover.
    AI_MODEL: us.amazon.nova-lite-v1:0
    # When Jev judges a reply not good enough, it is redone once on this.
    AI_STRONG_MODEL: us.anthropic.claude-haiku-4-5-20251001-v1:0
    ADMIN_USERNAME: admin
    # Payments (packs/billing): only these emails see /credits until
    # BILLING_ENABLED is set to "true".
    BILLING_TESTERS: non1993@protonmail.com
    # Free tier, change and Deploy: signup credits (launch offer, normally 10)
    # and lifetime free AI coach messages.
    SIGNUP_BONUS_CREDITS: "30"
    COACH_FREE_MESSAGES: "60"
    # AI Coach (packs/coach): only these emails see it until COACH_ENABLED is
    # set to "true".
    COACH_TESTERS: non1993@protonmail.com
    # Coach model: Nova Lite to keep cost down. Set it to
    # us.anthropic.claude-haiku-4-5-20251001-v1:0 if replies are too weak, or
    # remove it to go back to Sonnet (the code default).
    COACH_MODEL: us.amazon.nova-lite-v1:0
    # Sentry DSNs are meant to be public (they only allow sending events).
    SENTRY_DSN: https://058e816b8430efc0f1c2913d87129bc8@o4512250318618624.ingest.us.sentry.io/4512250323140608

accessories:
  db:
    image: postgres:17
    host: 159.195.9.248
    # No `port:` — netcup has no security group, so publishing 5432 puts
    # Postgres on the public internet. The app reaches it over Kamal's
    # docker network as `cvcraft-db`.
    env:
      clear:
        POSTGRES_USER: cvcraft
        POSTGRES_DB: cvcraft_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

  # Nightly pg_dump of the db into /root/cvcraft-db-backup/backups/ on the server,
  # keeping 7 daily, 4 weekly and 6 monthly dumps. Start it once with
  # `bin/kamal accessory boot db-backup`; Deploy doesn't boot accessories.
  db-backup:
    image: prodrigestivill/postgres-backup-local:17
    host: 159.195.9.248
    env:
      clear:
        POSTGRES_HOST: cvcraft-db
        POSTGRES_DB: cvcraft_production
        POSTGRES_USER: cvcraft
        SCHEDULE: "@daily"
        BACKUP_KEEP_DAYS: "7"
        BACKUP_KEEP_WEEKS: "4"
        BACKUP_KEEP_MONTHS: "6"
      secret:
        - POSTGRES_PASSWORD
    directories:
      - backups:/backups

  redis:
    image: redis:7.2
    host: 159.195.9.248
    cmd: redis-server --appendonly yes
    directories:
      - data:/data

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://root@159.195.9.248
