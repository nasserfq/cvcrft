      body: "بتفعيل التقديم التلقائي فإنك توافق على ما يلي: (1) ترسل منصة سيرة سيرتك الذاتية وما فيها من بيانات إلى جهة العمل في كل طلب؛ (2) تُعبّأ الطلبات وتُرسل بأداة آلية تعمل في متصفحك أنت؛ (3) أنت مسؤول عن الإجابات المرسلة نيابةً عنك، فراجعها؛ (4) بعض مواقع التوظيف تمنع الاستخدام الآلي، والتقديم من خلالها قد يخالف شروطها. يمكنك الإيقاف المؤقت أو إلغاء ربط الإضافة أو حذف طلباتك في أي وقت."
