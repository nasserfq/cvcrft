ar:
  home_landing:
    skip_to_content: "انتقل إلى المحتوى"
    tagline_1: "اكتب خبرتك بكلماتك."
    tagline_2: "وأرسل سيرة يقرؤها مسؤول التوظيف فعلا."
    faq_title: "أسئلة قبل أن تبدأ"
    faq_subtitle: "إجابات قصيرة لأكثر ما يسألنا عنه الناس."
    faq:
      q1: "هل استخدام سيرة مجاني؟"
      a1: "بناء سيرتك وتعديلها وتحميلها بصيغة PDF مجاني بالكامل. كل أداة ذكاء اصطناعي لها استخدامات مجانية، وبعدها يمكنك شحن رصيد فقط إن أردت المزيد."
      q2: "هل ستتجاوز سيرتي أنظمة تتبع المتقدمين ATS؟"
      a2: "القوالب الأحد عشر كلها مصممة لتقرأها أنظمة ATS، بعناوين أقسام قياسية ونص حقيقي قابل للتحديد. تختار القالب عند التحميل."
      q3: "هل يمكنني الكتابة بالعربية؟"
      a3: "نعم. اكتب النبذة المهنية ومهام الخبرة العملية بالعربية، ثم ترجمها إلى إنجليزية احترافية بضغطة واحدة قبل التحميل. السيرة النهائية باللغة الإنجليزية."
      q4: "كيف يعمل التوليد حسب الوظيفة؟"
      a4: "الصق الوصف الوظيفي واختر إحدى سيرك المحفوظة. يعيد الذكاء الاصطناعي كتابة النبذة المهنية لتناسب الوظيفة، ولا يلمس الأقسام التي كتبتها بنفسك."
      q5: "هل يمكنني استيراد ملفي من LinkedIn؟"
      a5: "حمّل ملفك من LinkedIn بصيغة PDF وارفعه هنا. نحوله إلى سيرة قابلة للتعديل تراجعها قبل الحفظ."
      q6: "ماذا يحدث لبياناتي؟"
      a6: "نستخدم بياناتك لبناء سيرتك فقط. يمكنك تصدير كل بياناتك في ملف أو حذف حسابك في أي وقت من صفحة ملفك الشخصي."
      privacy_link: "اقرأ سياسة الخصوصية"
