# Recurring jobs, loaded by sidekiq-cron when a Sidekiq server process starts
# (see config/initializers/sidekiq.rb). Times are in the server's time zone.
# Jobs removed from this file are also removed from Redis on the next start.

# PDPL retention: drops old OTP codes and failed imports/analyses, and clears
# extracted CV text after 30 days. See docs/pdpl.md for the retention table.
data_retention:
  cron: "15 3 * * *"
  class: "DataRetentionJob"
  queue: default

# Fails CV generations, analyses, translations and imports stuck in
# pending/processing for over 30 minutes, and refunds their credit.
stale_work_sweeper:
  cron: "*/10 * * * *"
  class: "StaleWorkSweeperJob"
  queue: default

# Checks the AI success-rate SLO and Sidekiq dead jobs, and warns Sentry on a
# miss (app/services/service_levels.rb).
slo_check:
  cron: "5 * * * *"
  class: "SloCheckJob"
  queue: default
