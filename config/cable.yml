# Jobs run in a separate Sidekiq process, so dev needs Redis to carry their
# broadcasts to the web process (the async adapter is in-process only).
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: cvcraft_dev

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
