<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Data Analyst</title></head>
<body>
  <!-- Mimics jobs.lever.co/<company>/<id>/apply: labels wrap the fields, ✱ marks required. -->
  <div class="application-page">
    <form id="application-form" class="application-form" method="POST" action="/acme/abc-123/apply" enctype="multipart/form-data" novalidate>
      <ul>
        <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div>
          <div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
        <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div>
          <div class="application-field"><input type="text" name="name" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div>
          <div class="application-field"><input type="email" name="email" required></div></label></li>
        <li class="application-question"><label><div class="application-label">Phone</div>
          <div class="application-field"><input type="text" name="phone"></div></label></li>
        <li class="application-question"><label><div class="application-label">Current company</div>
          <div class="application-field"><input type="text" name="org"></div></label></li>
        <li class="application-question"><label><div class="application-label">LinkedIn URL</div>
          <div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
        <li class="application-question custom-question">
          <div class="application-label">Will you now or in the future require visa sponsorship?<span class="required">✱</span></div>
          <div class="application-field"><ul>
            <li><label><input type="radio" name="cards[abc][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
            <li><label><input type="radio" name="cards[abc][field0]" value="No" required><span class="application-answer-alternative">No</span></label></li>
          </ul></div></li>
        <li class="application-question custom-question">
          <div class="application-label">Which tools do you use daily?</div>
          <div class="application-field"><ul>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="SQL"><span>SQL</span></label></li>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="Excel"><span>Excel</span></label></li>
            <li><label><input type="checkbox" name="cards[abc][field1]" value="Tableau"><span>Tableau</span></label></li>
          </ul></div></li>
        <li class="application-question"><label><div class="application-label">Additional information</div>
          <div class="application-field"><textarea name="comments"></textarea></div></label></li>
      </ul>
      <button type="submit" class="template-btn-submit">Submit application</button>
    </form>
  </div>
</body>
</html>
