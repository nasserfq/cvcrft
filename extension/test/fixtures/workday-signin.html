<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign In</title></head>
<body>
  <!-- Mimics the Workday step after "Apply Manually": a candidate account is required. -->
  <div data-automation-id="popUpDialog" role="dialog">
    <h2>Sign In</h2>
    <label for="email">Email Address</label><input id="email" type="text" data-automation-id="email">
    <label for="password">Password</label><input id="password" type="password" data-automation-id="password">
    <button data-automation-id="signInSubmitButton">Sign In</button>
    <button data-automation-id="createAccountLink">Create Account</button>
  </div>
</body>
</html>
