<!DOCTYPE html>
<!-- jobs.lever.co/{site}/{id}/apply markup, scripts and the hCaptcha widget
     removed. The form posts to Lever; here it goes (GET) to the local
     confirmation page. Also the fixture for Lever.questions. -->
<html lang="en">
<head><meta charset="utf-8"><title>Acme - Marketing Lead</title></head>
<body>
<div class="content-wrapper application-page">
  <div class="content">
    <form id="application-form" method="get" enctype="multipart/form-data" action="lever_confirmation.html">
      <input type="hidden" name="accountId" value="0f1e2d3c">
      <div class="section page-centered application-form">
        <h4>Submit your application</h4>
        <ul>
          <li class="application-question resume">
            <label>
              <div class="application-label">Resume/CV<span class="required">✱</span></div>
              <div class="application-field">
                <a class="awesome postings-btn template-btn-utility visible-resume-upload">
                  <input class="application-file-input" id="resume-upload-input" type="file" name="resume" data-qa="input-resume" required>
                  <span class="default-label">Attach resume/CV</span>
                </a>
              </div>
            </label>
          </li>
          <li class="application-question">
            <label>
              <div class="application-label">Full name<span class="required">✱</span></div>
              <div class="application-field"><input type="text" name="name" required data-qa="name-input"></div>
            </label>
          </li>
          <li class="application-question">
            <label>
              <div class="application-label">Email<span class="required">✱</span></div>
              <div class="application-field"><input type="email" name="email" required data-qa="email-input"></div>
            </label>
          </li>
          <li class="application-question">
            <label>
              <div class="application-label">Phone</div>
              <div class="application-field"><input type="text" name="phone" data-qa="phone-input"></div>
            </label>
          </li>
          <li class="application-question">
            <label>
              <div class="application-label">Current company</div>
              <div class="application-field"><input type="text" name="org" data-qa="org-input"></div>
            </label>
          </li>
        </ul>
      </div>
      <div class="section page-centered application-form">
        <h4>Links</h4>
        <ul>
          <li class="application-question">
            <label>
              <div class="application-label">LinkedIn URL</div>
              <div class="application-field"><input type="text" name="urls[LinkedIn]"></div>
            </label>
          </li>
        </ul>
      </div>
      <div class="section page-centered application-form" data-qa="additional-cards">
        <input type="hidden" name="cards[5a7b9c][baseTemplate]" value="{}">
        <ul>
          <li class="application-question custom-question">
            <div class="application-label full-width"><div class="text">Are you authorized to work in Saudi Arabia?<span class="required">✱</span></div></div>
            <div class="application-field full-width">
              <ul data-qa="multiple-choice">
                <li><label><input type="radio" name="cards[5a7b9c][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
                <li><label><input type="radio" name="cards[5a7b9c][field0]" value="No" required><span class="application-answer-alternative">No</span></label></li>
              </ul>
            </div>
          </li>
          <li class="application-question custom-question">
            <div class="application-label full-width"><div class="text">Which channels have you run?</div></div>
            <div class="application-field full-width">
              <ul data-qa="checkboxes">
                <li><label><input type="checkbox" name="cards[5a7b9c][field1]" value="Paid social"><span class="application-answer-alternative">Paid social</span></label></li>
                <li><label><input type="checkbox" name="cards[5a7b9c][field1]" value="SEO"><span class="application-answer-alternative">SEO</span></label></li>
                <li><label><input type="checkbox" name="cards[5a7b9c][field1]" value="Events"><span class="application-answer-alternative">Events</span></label></li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
      <div class="section page-centered application-form" id="eeo-section">
        <h4>U.S. Equal Employment Opportunity information</h4>
        <ul>
          <li class="application-question">
            <label>
              <div class="application-label">Gender</div>
              <div class="application-field">
                <select name="eeo[gender]">
                  <option value="">Select ...</option>
                  <option value="Female">Female</option>
                  <option value="Male">Male</option>
                  <option value="Decline to self-identify">Decline to self-identify</option>
                </select>
              </div>
            </label>
          </li>
        </ul>
      </div>
      <div class="section page-centered application-form">
        <h4>Additional information</h4>
        <ul>
          <li class="application-question">
            <div class="application-field full-width"><textarea name="comments" id="additional-information" placeholder="Add a cover letter or anything else you want to share."></textarea></div>
          </li>
        </ul>
      </div>
      <div class="section page-centered last-section-apply">
        <button id="btn-submit" type="submit" class="postings-btn template-btn-submit">Submit application</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
