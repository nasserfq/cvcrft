      - job_title: "Senior Data Scientist"
        company: "DataCorp"
        start_date: "2020-01"
        end_date: ""
        is_current: true
        responsibilities:
          - "Led machine learning initiatives"
          - "Built data pipelines"
      - job_title: "Data Analyst"
        company: "Analytics Inc"
        start_date: "2018-01"
        end_date: "2019-12"
        is_current: false
        responsibilities:
          - "Analyzed business data"
    educations:
      - degree: "Master of Science in Data Science"
        institution: "King Saud University"
        start_date: "2016"
        end_date: "2018"
        gpa: "3.8"
        is_current: false
