name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Up to 20 min waiting for CI, then the deploy itself (~5 min).
    timeout-minutes: 45

    steps:
      - name: Only deploy main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy runs only from main, not ${GITHUB_REF#refs/heads/}. Pick main in the branch list."
          exit 1

      # CI runs on every push to main. Wait for that run on this exact commit
      # and stop unless it passed.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 20 * 60))
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=20" \
              --jq '.workflow_runs | sort_by(.run_number) | last | if . == null then "" else "\(.status)|\(.conclusion // "")|\(.html_url)" end')
            IFS='|' read -r status conclusion url <<< "$run" || true
            if [ -z "$status" ]; then
              echo "No CI run for ${SHA:0:7} yet."
            elif [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed on ${SHA:0:7}: $url"
                exit 0
              fi
              echo "::error::CI on ${SHA:0:7} ended '$conclusion', not deploying: $url"
              exit 1
            else
              echo "CI on ${SHA:0:7} is $status: $url"
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI on ${SHA:0:7} did not finish within 20 minutes. Run Deploy again once it is green."
              exit 1
            fi
            sleep 20
          done

      - name: Load deploy secrets
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          printf '%s\n' "$DEPLOY_ENV" | tr -d '\r' | grep -E '^[A-Z_]+=' | while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
            echo "$line" >> "$GITHUB_ENV"
          done

      # Every other single-line repo secret (e.g. MOYASAR_SECRET_KEY) becomes an
      # env var too, so a new secret can be added on its own without re-pasting
      # DEPLOY_ENV.
      - name: Load separate secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          printf '%s' "$SECRETS_JSON" | jq -r '
            to_entries[]
            | select(.key | test("^[A-Z][A-Z0-9_]*$"))
            | select(.key | IN("DEPLOY_ENV", "SSH_PRIVATE_KEY", "GITHUB_TOKEN") | not)
            | .value |= sub("[\r\n]+$"; "")
            | select(.value | contains("\n") | not)
            | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install keys
        run: |
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/cvcraft_netcup
          chmod 600 ~/.ssh/cvcraft_netcup config/master.key
          ssh-keyscan -t ed25519 159.195.9.248 >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/cvcraft_netcup
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # .kamal/hooks/pre-deploy dumps the database before the new release
      # boots and runs its migrations.
      - name: Deploy
        id: deploy
        run: bin/kamal deploy

      # A cancelled or killed deploy leaves .kamal/lock-cvcraft on the server
      # and every later Deploy fails with "Deploy lock found".
      - name: Release deploy lock
        if: (failure() || cancelled()) && (steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled')
        run: bin/kamal lock release || echo "No lock released (Kamal may have released it already)."

      - name: Smoke test
        run: |
          failed=0
          for path in /up / "/?locale=en" /login /sitemap.xml; do
            code=000
            for attempt in 1 2 3 4 5; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://cvcrft.com$path" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" = "200" ]; then
              echo "200 $path"
            else
              echo "::error::$path answered $code after 5 tries"
              failed=1
            fi
          done
          if [ "$failed" = 1 ]; then
            echo "::error::The new release is live but failing. Actions › Rollback › Run workflow puts the previous release back (it does not undo migrations)."
            exit 1
          fi
