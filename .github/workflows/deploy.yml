name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Load deploy secrets
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
        run: |
          printf '%s\n' "$DEPLOY_ENV" | tr -d '\r' | grep -E '^[A-Z_]+=' | while IFS= read -r line; do
            echo "::add-mask::${line#*=}"
            echo "$line" >> "$GITHUB_ENV"
          done

      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install keys
        run: |
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/cvcraft_netcup
          chmod 600 ~/.ssh/cvcraft_netcup config/master.key
          ssh-keyscan -t ed25519 159.195.9.248 >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/cvcraft_netcup
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        run: bin/kamal deploy
