name: Deploy

# Runs `kamal deploy` for the current main, only when started by hand:
# GitHub app › cvcrft › Actions › Deploy › Run workflow.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      CVCRAFT_DATABASE_PASSWORD: ${{ secrets.CVCRAFT_DATABASE_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # .kamal/secrets reads the master key from config/master.key, and
      # config/deploy.yml expects the SSH key at ~/.ssh/cvcraft_netcup.
      # The image is built on the server itself, so only SSH is needed here.
      - name: Install keys
        run: |
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/cvcraft_netcup
          chmod 600 ~/.ssh/cvcraft_netcup config/master.key
          ssh-keyscan -H 159.195.9.248 >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/cvcraft_netcup
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Deploy
        run: bin/kamal deploy
